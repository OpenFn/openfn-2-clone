name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Skip when only docs change. Later lines win: annotations/ is bundled into
    # the app (the annotations panel), so it still deploys.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.claude/**"
      - "annotations/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This repo was renamed from openfn-3-poc, which local dev still uses as its base.
      - run: npm run build -- --base=/openfn-2-clone/
      - run: npm run build-storybook -- -o dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
