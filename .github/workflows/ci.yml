name: CI

on:
  pull_request:
    branches: [main]
    # Skip when only docs change. Later lines win: annotations/ is bundled into
    # the app (the annotations panel), so it still runs CI.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.claude/**"
      - "annotations/**"

# Three jobs that start together, so CI takes as long as the slowest one.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The design-system numbers and debt: lines only go down (scripts/design-system-baseline.json).
      - run: node scripts/design-system-metrics.mjs --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
